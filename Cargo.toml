[package]
name = "rtdb-rs"
version = "0.3.2"
edition = "2021"
description = "Firebase Realtime Database REST client for Rust — auth, read, write, patch, delete"
license = "MIT"
repository = "https://github.com/kab102395/rtdb-rs"
readme = "README.md"
documentation = "https://docs.rs/rtdb-rs"
keywords = ["firebase", "rtdb", "realtime-database", "google", "async"]
categories = ["web-programming", "api-bindings", "database"]

[lib]
name = "rtdb_rs"
crate-type = ["rlib"]

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
